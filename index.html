<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little something for you</title>
<style>
:root{--bg1:#FAFCFF;--bg2:#DCECF7;--bg3:#E9E4F7;--ink:#4a566e;--soft:#68758B;--accent:#8b8bd6;--coral:#f4a6c3;--card:rgba(255,255,255,.62);--line:rgba(255,255,255,.8);--sh:0 20px 50px rgba(200,110,140,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body.t2{--bg1:#E9E4F7;--bg2:#F8DDE8;--bg3:#FAFCFF;--accent:#a28fd8;--coral:#f4a6c3}
body.t3{--bg1:#E3F1EC;--bg2:#DCECF7;--bg3:#FAFCFF;--accent:#7fb8a8;--coral:#9ec5ee}
*{box-sizing:border-box;margin:0}
body{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:#fff7f3;background:linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg3));background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .8s}
h1,h2{font-weight:700;letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(2.4rem,7vw,5rem)}h2{font-size:clamp(2rem,5.5vw,3.8rem)}
p{line-height:1.6;color:var(--soft)}
section{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:96px 24px;position:relative}
.wrap{max-width:720px;width:100%}
.lead{font-size:clamp(1.05rem,2.4vw,1.4rem);margin-top:24px}
.grad{background:linear-gradient(90deg,var(--accent),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{font:inherit;font-weight:600;font-size:1.05rem;border:0;border-radius:999px;padding:16px 32px;cursor:pointer;color:#3f4a66;background:linear-gradient(135deg,var(--accent),var(--coral));box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh);border:1px solid var(--line);backdrop-filter:blur(14px)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh);border-radius:28px}
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s,transform 1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg1);transition:opacity .8s,visibility .8s}
#loader.off{opacity:0;visibility:hidden}
#loader span{font-size:3rem;animation:beat 1.1s infinite}
@keyframes beat{50%{transform:scale(1.25)}}
#intro{overflow:hidden}
#intro:before{content:"";position:absolute;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),transparent 65%);animation:glow 6s ease-in-out infinite;pointer-events:none}
@keyframes glow{50%{transform:scale(1.15);opacity:.7}}
.fh{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite;pointer-events:none;color:var(--accent)}
@keyframes rise{10%{opacity:.5}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
#main{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;margin-top:48px;max-width:960px;width:100%}
.card{padding:28px 22px 30px;cursor:pointer;transition:transform .4s,box-shadow .4s;animation:fl 6s ease-in-out infinite;text-align:center}
.card:nth-child(2){animation-delay:-2s}.card:nth-child(3){animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-8px)}}
.card:hover,.card.on{transform:translateY(-10px) scale(1.03)!important;box-shadow:0 28px 60px color-mix(in srgb,var(--accent) 30%,transparent)}
.ph{aspect-ratio:4/3;border-radius:18px;margin-bottom:20px;display:grid;place-items:center;font-size:2.2rem;background:linear-gradient(135deg,var(--bg1),var(--bg3));transition:filter .4s;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.card.on .ph,.card:hover .ph{filter:saturate(1.3) brightness(1.04)}
.card h3{font-size:1.25rem;letter-spacing:-.02em}
.card p{font-size:.95rem;margin-top:8px;max-height:0;opacity:0;overflow:hidden;transition:.5s}
.card.on p,.card:hover p{max-height:120px;opacity:1}
#area{position:relative;width:min(92vw,640px);height:min(60vh,420px);margin:32px auto 0;overflow:hidden;touch-action:manipulation;background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(220,236,247,.5),rgba(233,228,247,.45))}
.gh{position:absolute;left:0;top:0;width:68px;height:68px;border:0;padding:0;background:none;cursor:pointer;will-change:transform;touch-action:manipulation}
.gh .in{display:block;width:100%;height:100%}.gh .in svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 8px rgba(120,130,180,.25))}
.gh.pop{pointer-events:none}.gh.pop .in{animation:pop .7s forwards}
@keyframes pop{35%{transform:translateY(-18px) scale(1.2)}100%{transform:translateY(-8px) scale(0);opacity:0}}
.wl{transform-origin:24px 34px;animation:wf .45s ease-in-out infinite alternate}.wr{transform-origin:40px 34px;animation:wg .45s ease-in-out infinite alternate}
@keyframes wf{to{transform:rotate(-20deg)}}@keyframes wg{to{transform:rotate(20deg)}}
#buddy{position:absolute;left:0;top:0;font-size:1.6rem;pointer-events:none;transition:transform 2.4s ease-in-out}
#msg{min-height:2.4em;margin-top:20px;font-size:1.25rem;font-weight:600;color:var(--accent)}
#prog{display:flex;gap:10px;justify-content:center;margin-top:20px}
#prog i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 2px var(--accent);transition:.4s}
#prog i.f{background:var(--accent);transform:scale(1.25)}
.sp{position:fixed;pointer-events:none;z-index:60;font-size:14px;animation:sp .9s forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:70;pointer-events:none;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
#final{display:none}
.orb{width:120px;height:120px;border-radius:50%;margin:0 auto 36px;display:grid;place-items:center;font-size:3.4rem;background:radial-gradient(circle,#fff,color-mix(in srgb,var(--coral) 45%,#fff));box-shadow:0 0 80px 20px color-mix(in srgb,var(--accent) 40%,transparent);animation:beat 2.4s infinite}
.fl{margin-top:36px;font-size:clamp(1.3rem,3.4vw,2rem);font-weight:700;letter-spacing:-.02em}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:28px}
#talk{animation:tg 3s ease-in-out infinite}@keyframes tg{50%{box-shadow:0 10px 44px color-mix(in srgb,var(--accent) 70%,transparent)}}
#talk,#time{white-space:nowrap;max-width:100%;transition:font-size .6s cubic-bezier(.3,1.4,.5,1),padding .6s cubic-bezier(.3,1.4,.5,1),transform .25s,box-shadow .25s}
#time{position:relative}#time::after{content:"";position:absolute;inset:-12px}
#reply{margin-top:28px;padding:24px 28px;max-width:520px;display:none}
#reply p{color:var(--ink);font-size:1.15rem}
.tool{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:80;display:flex;gap:8px}
.tool button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);cursor:pointer;font-size:1.1rem;box-shadow:var(--sh)}
[hidden]{display:none!important}
#snow{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
#snow span{position:absolute;top:-20px;color:#bcd9ee;opacity:.8;animation:snow linear infinite}
@keyframes snow{to{transform:translate(var(--d),108vh) rotate(180deg)}}
#gift{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:24px;background:rgba(250,252,255,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.gcard{padding:32px 28px;text-align:center;max-width:380px;width:100%;animation:gin .7s cubic-bezier(.3,1.4,.5,1);box-shadow:0 0 70px rgba(184,184,232,.55)}
@keyframes gin{from{opacity:0;transform:translateY(20px) scale(.9)}}
.gbox{border:0;background:none;cursor:pointer;display:block;margin:0 auto 16px;width:190px;animation:fl 3s ease-in-out infinite}
.gbox svg{width:100%;display:block}.tip{font-size:.9rem;color:var(--soft)}
#glid{transform-box:fill-box;transform-origin:center;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}.gbox.open #glid{transform:translateY(-36px) rotate(-16deg)}
#ghug{position:relative;margin-bottom:16px;animation:gin .8s cubic-bezier(.3,1.4,.5,1)}#ghug svg{width:220px;max-width:100%}#ghug p{color:var(--ink);font-weight:600;font-size:1.15rem;margin-top:8px}
.hv span{position:absolute;bottom:45%;color:#f6a5c4;animation:rise2 3s ease-in infinite;opacity:0}
@keyframes rise2{20%{opacity:.9}100%{transform:translateY(-110px);opacity:0}}
footer{text-align:center;padding:40px 24px 56px;font-size:.9rem;color:var(--soft)}
#cur{position:fixed;width:10px;height:10px;border-radius:50%;background:var(--accent);opacity:0;pointer-events:none;z-index:90;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="loader" aria-label="Loading"><span>💗</span></div>
<div class="tool"><button id="music" aria-pressed="false" aria-label="Toggle music" title="Music (off)">🎵</button><button id="theme" aria-label="Change theme" title="Change theme">🎨</button></div>
<div id="snow" aria-hidden="true"></div>
<div id="cur"></div>

<section id="intro">
 <div class="wrap" style="position:relative">
  <h1 class="rv" data-t="intro.title"></h1>
  <p class="lead rv" data-t="intro.sub"></p>
  <p style="margin-top:40px" class="rv"><button class="btn" id="open" data-t="intro.button"></button></p>
 </div>
</section>

<div id="main">
 <section id="game"><div class="wrap">
  <h2 class="rv" data-t="game.title"></h2>
  <p class="lead rv" data-t="game.sub"></p>
  <div id="area" class="glass" aria-label="Play area"></div>
  <div id="msg" aria-live="polite"></div>
  <div id="prog" aria-hidden="true"></div>
  <p id="count" style="margin-top:12px;font-size:.95rem"></p>
  <p style="margin-top:20px"><button class="btn ghost" id="replay"></button></p>
 </div></section>

 <section id="final"><div class="wrap">
  <div class="orb rv">💗</div>
  <h2 class="rv grad" data-t="final.title"></h2>
  <p class="lead rv" style="color:var(--ink)" data-t="final.line1"></p>
  <p class="fl rv" data-t="final.question"></p>
  <div class="row rv"><button class="btn" id="talk"></button><button class="btn ghost" id="time"></button><button class="btn ghost" id="hug"></button></div>
  <div id="reply" class="glass" role="status"><p></p></div>
 </div></section>
 <footer data-t="footer"></footer>
</div>

<script>
/* ============ EDIT EVERYTHING HERE ============ */
const CONFIG = {
  herName: "[Her name]", yourName: "[Your name]", date: "[Date]",
  intro:{title:"Hey, my favorite person. ❤️",
    sub:"I made something for you. It’s not perfect, just like me, but every little part of it comes from my heart.",
    button:"Open this little surprise ✨"},
  message:{title:"There’s something I want you to know.",
    body:"I know that I may have hurt you, and I’m truly sorry. You mean so much to me, and the last thing I ever want is to make you feel anything less than loved and appreciated. I’m not here to make excuses. I just want you to know that your feelings matter to me, that I’m thinking about you, and that I want to do better."},
  moments:{title:"Our little moments.",
    cards:[
      {title:"The way you make me smile.",note:"[Add your own words here]",photo:"",emoji:"😊"},
      {title:"The little things that make you special.",note:"[Add a specific thing you love]",photo:"",emoji:"✨"},
      {title:"The moments I wish I could relive.",note:"[Add a memory only you two know]",photo:"",emoji:"🌅"}]},
  game:{title:"Catch the Little Rabbits & Winged Hearts 🐇💗",sub:"No timer, no rush. Catch 7 little friends, one at a time.",
    replay:"Play again",
    messages:["You deserve kindness","You matter so much","I’m listening","I’ll keep trying","A little more love for you","Your feelings are important","Thank you for being you"],
    start:"Tap a heart to begin"},
  final:{title:"If I could give you one thing...",
    line1:"It would be the ability to see yourself through my eyes, even for a moment, so you could understand just how special you are to me.",
    
    question:"Can I have the chance to make things a little better? 🥹❤️",
    talk:"Let’s talk ❤️", time:"I need some time",
    hug:"Can I at least get a hug first? 🫂", talkReply:"yeeeey :)"},
  footer:"Made with love, just for you. ❤️"
};
/* ============ END CONFIG ============ */

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const get=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
$$('[data-t]').forEach(e=>e.textContent=get(CONFIG,e.dataset.t));
$('#replay').textContent=CONFIG.game.replay;
$('#talk').textContent=CONFIG.final.talk;$('#time').textContent=CONFIG.final.time;

/* loader */
addEventListener('load',()=>setTimeout(()=>$('#loader').classList.add('off'),700));
setTimeout(()=>$('#loader').classList.add('off'),2500);

/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.2});
const watch=()=>$$('.rv:not(.in)').forEach(e=>io.observe(e));
watch();setTimeout(()=>$$('#intro .rv').forEach((e,i)=>setTimeout(()=>e.classList.add('in'),300+i*350)),900);

/* floating hearts */
for(let i=0;i<14;i++){const h=document.createElement('span');h.className='fh';h.textContent=i%3?'♥':'♡';
 h.style.cssText=`left:${Math.random()*100}%;font-size:${14+Math.random()*22}px;animation-duration:${9+Math.random()*9}s;animation-delay:${-Math.random()*14}s`;$('#intro').appendChild(h)}

/* open */
$('#open').onclick=()=>{const i=$('#intro');i.style.transition='opacity .8s';i.style.opacity=0;
 setTimeout(()=>{i.style.display='none';$('#main').style.display='block';scrollTo({top:0,behavior:'auto'});watch()},800)};

/* game */
const area=$('#area'),N=7;let hearts=[],got=0,raf,buddyT;
const prog=$('#prog');
function sparkle(x,y){for(let i=0;i<8;i++){const s=document.createElement('span');s.className='sp';s.textContent='✦';s.style.left=x+'px';s.style.top=y+'px';
 const a=i/8*6.28,r=30+Math.random()*30;s.style.setProperty('--x',Math.cos(a)*r+'px');s.style.setProperty('--y',Math.sin(a)*r+'px');s.style.color=['#ffb3c6','#ffd7a8','#c9b6ff'][i%3];document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function confetti(){if(RM)return;const cs=['#ffb3c6','#ffd7a8','#c9b6ff','#ff8a80','#a8d4ff'];for(let i=0;i<90;i++){const c=document.createElement('i');c.className='cf';
 c.style.cssText=`left:${Math.random()*100}vw;background:${cs[i%5]};animation-duration:${2.5+Math.random()*2.5}s;animation-delay:${Math.random()*.8}s;border-radius:${i%2?'50%':'2px'}`;document.body.appendChild(c);setTimeout(()=>c.remove(),6500)}}
const S=68,TYPES=['r','h','r','h','r','h','r'];let last=0;
const RAB='<svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="24" cy="14" rx="6" ry="14" fill="#fff" stroke="#c9d3e8" stroke-width="1.5"/><ellipse cx="24" cy="14" rx="2.8" ry="9" fill="#f6b8cf"/><ellipse cx="40" cy="14" rx="6" ry="14" fill="#fff" stroke="#c9d3e8" stroke-width="1.5"/><ellipse cx="40" cy="14" rx="2.8" ry="9" fill="#f6b8cf"/><ellipse cx="32" cy="49" rx="17" ry="12" fill="#fff" stroke="#c9d3e8" stroke-width="1.5"/><circle cx="32" cy="34" r="13" fill="#fff" stroke="#c9d3e8" stroke-width="1.5"/><circle cx="27" cy="33" r="1.8" fill="#6b7590"/><circle cx="37" cy="33" r="1.8" fill="#6b7590"/><ellipse cx="32" cy="38" rx="2" ry="1.5" fill="#f4a6c3"/><circle cx="23" cy="38" r="2.6" fill="#f8c9da" opacity=".7"/><circle cx="41" cy="38" r="2.6" fill="#f8c9da" opacity=".7"/></svg>';
const HRT='<svg viewBox="0 0 64 64" aria-hidden="true"><g class="wl"><path d="M22 32C10 20 3 30 8 39c4 6 12 5 16 1z" fill="#fff" stroke="#d3daf0" stroke-width="1.5"/></g><g class="wr"><path d="M42 32C54 20 61 30 56 39c-4 6-12 5-16 1z" fill="#fff" stroke="#d3daf0" stroke-width="1.5"/></g><path d="M32 56C12 42 16 22 26 22c4 0 6 3 6 5 0-2 2-5 6-5 10 0 14 20-6 34z" fill="#f6a5c4"/></svg>';
function loveFloat(x,y){const s=document.createElement('span');s.className='sp';s.textContent='💗';s.style.cssText=`left:${x}px;top:${y}px;font-size:24px;--x:0px;--y:-60px`;document.body.appendChild(s);setTimeout(()=>s.remove(),900)}
function reset(){cancelAnimationFrame(raf);hearts.forEach(h=>h.el.remove());hearts=[];got=0;$('#msg').textContent=CONFIG.game.start;
 prog.innerHTML='<i></i>'.repeat(N);$('#count').textContent=`0 / ${N} collected`;
 const W=area.clientWidth-S,H=area.clientHeight-S;
 TYPES.forEach((t,i)=>{const el=document.createElement('button');el.className='gh';el.innerHTML='<span class="in">'+(t==='r'?RAB:HRT)+'</span>';el.setAttribute('aria-label',(t==='r'?'Catch rabbit ':'Catch flying heart ')+(i+1));
  const h={el,t,x:Math.random()*W,y:Math.random()*H,sx:0,sy:0,tx:0,ty:0,p:1,dur:700,wait:300+Math.random()*1500,a:Math.random()*6,vx:(Math.random()-.5)*.1,vy:(Math.random()-.5)*.06,done:false};
  el.addEventListener('pointerdown',e=>{e.preventDefault();collect(h)});el.onclick=()=>collect(h);area.appendChild(el);hearts.push(h);el.style.transform=`translate(${h.x}px,${h.y}px)`});
 last=performance.now();raf=requestAnimationFrame(loop)}
function loop(t){const dt=Math.min(t-last||16,50);last=t;const W=area.clientWidth-S,H=area.clientHeight-S;
 hearts.forEach(h=>{if(h.done)return;let y;
  if(h.t==='r'){
   if(h.p>=1){h.wait-=dt;if(h.wait<=0&&!RM){h.sx=h.x;h.sy=h.y;h.tx=Math.max(0,Math.min(W,h.x+(Math.random()-.5)*240));h.ty=Math.max(0,Math.min(H,h.y+(Math.random()-.5)*150));h.p=0;h.dur=600+Math.random()*500;h.wait=400+Math.random()*1400}}
   else{h.p=Math.min(1,h.p+dt/h.dur);h.x=h.sx+(h.tx-h.sx)*h.p;h.y=h.sy+(h.ty-h.sy)*h.p}
   y=h.y-Math.sin(h.p*Math.PI)*36}
  else{h.a+=dt*.004;if(!RM){h.vx=Math.max(-.07,Math.min(.07,h.vx+(Math.random()-.5)*.006));h.vy=Math.max(-.05,Math.min(.05,h.vy+(Math.random()-.5)*.006));h.x+=h.vx*dt;h.y+=h.vy*dt}
   if(h.x<0||h.x>W)h.vx*=-1;if(h.y<0||h.y>H)h.vy*=-1;h.x=Math.max(0,Math.min(W,h.x));h.y=Math.max(0,Math.min(H,h.y));y=h.y+Math.sin(h.a)*6}
  h.el.style.transform=`translate(${Math.min(W,h.x)}px,${Math.max(0,Math.min(H,y))}px)`});
 raf=requestAnimationFrame(loop)}
function collect(h){if(h.done)return;h.done=true;h.el.classList.add('pop');const r=h.el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;sparkle(cx,cy);loveFloat(cx,cy-10);
 $('#msg').textContent=CONFIG.game.messages[got%CONFIG.game.messages.length];prog.children[got].classList.add('f');got++;$('#count').textContent=`${got} / ${N} collected`;
 if(got===N)win()}
function win(){confetti();$('#msg').textContent='You caught all my love! 💗';setTimeout(()=>{const f=$('#final');f.style.display='flex';watch();setTimeout(()=>f.scrollIntoView({behavior:RM?'auto':'smooth'}),100)},1400)}
$('#replay').onclick=()=>{reset()};
new IntersectionObserver((es,o)=>{if(es[0].isIntersecting){reset();o.disconnect()}},{threshold:.2}).observe(area);

/* final buttons */
function reply(t){const r=$('#reply');r.style.display='block';r.querySelector('p').textContent=t;r.animate([{opacity:0,transform:'translateY(16px) scale(.8)'},{opacity:1,transform:'translateY(-4px) scale(1.06)',offset:.6},{opacity:1,transform:'none'}],{duration:800,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'both'})}
const talk=$('#talk'),burst=()=>{if(RM)return;const r=talk.getBoundingClientRect();sparkle(r.left+r.width*.25,r.top+r.height/2);sparkle(r.left+r.width*.5,r.top+8);sparkle(r.left+r.width*.75,r.top+r.height/2)};
talk.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')burst()});
talk.onclick=()=>{burst();reply(CONFIG.final.talkReply)};
let w0=0;
function resizeBtns(){const T=$('#talk'),M=$('#time'),row=T.parentElement;if(!w0)w0=T.offsetWidth;
 const sT=Math.min(Math.pow(1.2,tc),Math.max(1,row.clientWidth*.96/w0)),sM=Math.max(Math.pow(.85,tc),.5);
 T.style.fontSize=1.05*sT+'rem';T.style.padding=`${16*sT}px ${32*sT}px`;
 M.style.fontSize=1.05*sM+'rem';M.style.padding=`${16*sM}px ${32*sM}px`;
 if(!RM){T.animate([{transform:'scale(1)'},{transform:'scale(1.1) rotate(-2deg)'},{transform:'scale(1)'}],{duration:600,easing:'ease-out'});burst()}}
let tc=0;$('#time').onclick=()=>{tc++;resizeBtns();{const k=Math.min(tc,6);$('.orb').style.filter=`drop-shadow(0 0 ${k*8}px var(--coral)) saturate(${1+k*.08})`}if(!RM)$('.orb').animate([{transform:'rotate(0)'},{transform:'rotate(-9deg) scale(.95)'},{transform:'rotate(9deg) scale(.95)'},{transform:'rotate(0)'}],{duration:700,easing:'ease-in-out'})};

/* playful hug button: dodges a few times (mouse/touch only), then settles. Keyboard and clicks always work. */
const hug=$('#hug');hug.textContent=CONFIG.final.hug;hug.style.transition='transform .45s cubic-bezier(.3,1.5,.5,1)';
let dodges=0,tx=0,ty=0,lastD=0;
function dodge(e){if(dodges>=4||RM)return;e.preventDefault();dodges++;lastD=Date.now();
 if(dodges>=4){tx=ty=0;hug.style.transform='';return}
 const r=hug.getBoundingClientRect(),bl=r.left-tx,bt=r.top-ty,m=16,rnd=(a,b)=>a+Math.random()*(b-a);
 tx=rnd(m-bl,innerWidth-r.width-m-bl);ty=Math.max(m-bt,Math.min(innerHeight-r.height-m-bt,rnd(-90,90)));
 hug.style.transform=`translate(${tx}px,${ty}px) rotate(${rnd(-8,8)}deg)`}
hug.addEventListener('pointerenter',dodge);hug.addEventListener('pointerdown',dodge);
hug.onclick=()=>{if(Date.now()-lastD<500)return;dodges=4;tx=ty=0;hug.style.transform='';openGift()};

/* theme */
let ti=0;$('#theme').onclick=()=>{ti=(ti+1)%3;document.body.className=ti?'t'+(ti+1):''};

/* music: gentle generated tones, OFF by default */
let ac,mi,on=false;const notes=[261.63,329.63,392,523.25,392,329.63,440,349.23];let ni=0;
function tone(f){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(.07,ac.currentTime+.4);g.gain.exponentialRampToValueAtTime(.0005,ac.currentTime+3.2);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+3.3)}
$('#music').onclick=()=>{on=!on;$('#music').setAttribute('aria-pressed',on);$('#music').title='Music ('+(on?'on':'off')+')';$('#music').style.opacity=on?1:.6;
 if(on){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();tone(notes[ni++%8]);mi=setInterval(()=>tone(notes[ni++%8]),1400)}else{clearInterval(mi)}};
$('#music').style.opacity=.6;

/* snow */
if(!RM){const sn=$('#snow');for(let i=0;i<26;i++){const s=document.createElement('span');s.textContent=i%3?'❄':'❅';s.style.cssText=`left:${Math.random()*100}%;font-size:${10+Math.random()*14}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*18}s;--d:${(Math.random()-.5)*80}px`;sn.appendChild(s)}}

/* hug gift */
const gift=$('#gift'),gbox=$('#gbox'),ghug=$('#ghug');
function openGift(){gift.hidden=false;gbox.classList.remove('open');gbox.hidden=false;ghug.hidden=true;gbox.focus()}
function closeGift(){gift.hidden=true;hug.focus()}
gbox.onclick=()=>{if(gbox.classList.contains('open'))return;gbox.classList.add('open');const r=gbox.getBoundingClientRect();for(let i=0;i<3;i++)sparkle(r.left+r.width*(.25+i*.25),r.top+24);
 setTimeout(()=>{gbox.hidden=true;ghug.hidden=false;const c=ghug.getBoundingClientRect();sparkle(c.left+c.width/2,c.top+30);sparkle(c.left+c.width*.25,c.top+60);sparkle(c.left+c.width*.75,c.top+60);$('#gclose').focus()},RM?0:800)};
$('#gclose').onclick=closeGift;gift.addEventListener('click',e=>{if(e.target===gift)closeGift()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!gift.hidden)closeGift()});

/* cursor glow (desktop only) */
if(matchMedia('(pointer:fine)').matches&&!RM){const c=$('#cur');let last=0;addEventListener('pointermove',e=>{c.style.opacity=.6;c.style.transform=`translate(${e.clientX-5}px,${e.clientY-5}px)`;
 if(Date.now()-last>90){last=Date.now();const s=document.createElement('span');s.className='sp';s.textContent='♥';s.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;color:var(--accent);font-size:10px;--x:0px;--y:18px`;document.body.appendChild(s);setTimeout(()=>s.remove(),900)}})}
</script>
<div id="gift" role="dialog" aria-modal="true" aria-label="A little hug gift" hidden>
 <div class="gcard glass">
  <button id="gbox" class="gbox" aria-label="Open the gift"><svg viewBox="0 0 160 150" aria-hidden="true"><rect x="30" y="72" width="100" height="68" rx="8" fill="#cfe5f5" stroke="#b4d2e8" stroke-width="2"/><rect x="72" y="72" width="16" height="68" fill="#f6b8cf"/><g id="glid"><rect x="24" y="50" width="112" height="26" rx="8" fill="#dcedf8" stroke="#b4d2e8" stroke-width="2"/><rect x="72" y="50" width="16" height="26" fill="#f6b8cf"/><ellipse cx="62" cy="44" rx="17" ry="10" transform="rotate(-20 62 44)" fill="#f6b8cf" stroke="#eba0bd" stroke-width="1.5"/><ellipse cx="98" cy="44" rx="17" ry="10" transform="rotate(20 98 44)" fill="#f6b8cf" stroke="#eba0bd" stroke-width="1.5"/><circle cx="80" cy="47" r="7" fill="#f2a0c0"/></g><text x="12" y="40" font-size="14" fill="#b8b8e8">✦</text><text x="138" y="60" font-size="12" fill="#f6a5c4">✦</text><text x="124" y="22" font-size="10" fill="#b8b8e8">✦</text></svg><span class="tip">Tap to open</span></button>
  <div id="ghug" hidden>
   <div class="hv" aria-hidden="true"><span style="left:12%">♥</span><span style="left:48%;animation-delay:1s">♥</span><span style="left:80%;animation-delay:2s">♥</span></div>
   <svg viewBox="0 0 200 150" role="img" aria-label="Two little rabbits hugging"><g fill="#fff" stroke="#c9d3e8" stroke-width="2"><ellipse cx="72" cy="36" rx="7" ry="22" transform="rotate(-12 72 36)"/><ellipse cx="96" cy="32" rx="7" ry="22" transform="rotate(8 96 32)"/><ellipse cx="104" cy="32" rx="7" ry="22" transform="rotate(-8 104 32)"/><ellipse cx="128" cy="36" rx="7" ry="22" transform="rotate(12 128 36)"/><ellipse cx="76" cy="116" rx="32" ry="28"/><ellipse cx="124" cy="116" rx="32" ry="28"/><circle cx="86" cy="80" r="24"/><circle cx="114" cy="80" r="24"/></g><g fill="#f6b8cf"><ellipse cx="72" cy="38" rx="3" ry="13" transform="rotate(-12 72 38)"/><ellipse cx="96" cy="34" rx="3" ry="13" transform="rotate(8 96 34)"/><ellipse cx="104" cy="34" rx="3" ry="13" transform="rotate(-8 104 34)"/><ellipse cx="128" cy="38" rx="3" ry="13" transform="rotate(12 128 38)"/><circle cx="72" cy="90" r="4" opacity=".6"/><circle cx="128" cy="90" r="4" opacity=".6"/><ellipse cx="80" cy="87" rx="2.5" ry="2"/><ellipse cx="120" cy="87" rx="2.5" ry="2"/></g><g fill="none" stroke="#6b7590" stroke-width="2" stroke-linecap="round"><path d="M76 80q4 4 8 0"/><path d="M116 80q4 4 8 0"/></g><path d="M58 112q42 24 84 0" stroke="#f6b8cf" stroke-width="8" fill="none" stroke-linecap="round" opacity=".9"/></svg>
   <p>A little hug, just for you. 🐰💗</p>
  </div>
  <button class="btn ghost" id="gclose">Close</button>
 </div>
</div>
</body>
